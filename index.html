<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reto de la semana · Cognitivo Gym</title>
<meta name="description" content="Un reto nuevo de atención y memoria cada semana. ¿Lo puedes resolver?">
<meta property="og:title" content="Reto de la semana · Cognitivo Gym">
<meta property="og:description" content="Un reto nuevo de atención y memoria cada semana. ¿Lo puedes resolver?">
<meta property="og:image" content="https://cognogym.com/portadas/sigue-el-balon.jpg">
<meta name="theme-color" content="#0a0a0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Cognitivo Gym's own look: the same colours and type as the gym's site */
@font-face{font-family:'Bebas Neue';src:url(BebasNeue.woff) format('woff');font-display:swap}
:root{--bg:#0a0a0f;--card:#14141c;--line:#2a2a36;--text:#fff;--mute:#8892a0;--orange:#FF6B35;--gold:#FFD700;--red:#FF4646;--grad:linear-gradient(135deg,var(--gold),var(--orange))}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:radial-gradient(900px 600px at 50% 0%,#2a1d08 0%,var(--bg) 70%) no-repeat,var(--bg);
  color:var(--text);font-family:Outfit,system-ui,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{width:min(520px,100% - 32px);margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 0 48px}
header{text-align:center;margin-bottom:18px}
.brand{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.5rem;letter-spacing:5px;text-decoration:none;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{display:block;font-size:.68rem;font-weight:800;letter-spacing:.3em;color:var(--mute);margin-top:2px}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(2.6rem,12vw,3.4rem);letter-spacing:.03em;margin:12px 0 4px;line-height:1}
.sub{color:var(--mute);margin:0}
.reto{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:18px 0}
.kick{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--grad);color:#1a0f0f}
.kick.old{background:var(--line);color:var(--mute)}
.reto h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:2.1rem;letter-spacing:.03em;margin:10px 0 2px;line-height:1.1}
.reto p{margin:0 0 12px;color:var(--mute)}
video{display:block;width:100%;aspect-ratio:9/16;max-height:78dvh;background:#000;border-radius:12px;object-fit:contain}
/* Our own play button: the phone's built-in controls dim the picture for the
   first seconds, exactly when the red ball is shown. */
.vid{position:relative}
.vid .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vid .play span{width:84px;height:84px;border-radius:50%;background:var(--grad);box-shadow:0 6px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.vid .play span::after{content:"";margin-left:8px;border-style:solid;border-width:18px 0 18px 30px;border-color:transparent transparent transparent #1a0d00}
.vid.on .play{display:none}
.como{margin:12px 0 0;padding:12px 14px;border-left:4px solid var(--orange);background:rgba(255,122,24,.08);border-radius:0 10px 10px 0;font-size:.95rem}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:800;font-size:.95rem;padding:13px 10px;border-radius:12px;border:none;cursor:pointer}
.btn.wa{background:#25D366;color:#06210f}
.btn.copy{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.resp{margin-top:14px}
.resp summary{cursor:pointer;font-weight:800;color:var(--gold);padding:10px 0;list-style:none}
.resp summary::-webkit-details-marker{display:none}
.resp summary::before{content:"▸ ";}
.resp[open] summary::before{content:"▾ ";}
.gym{display:block;text-align:center;text-decoration:none;margin:26px 0 0;padding:18px;border-radius:16px;
  background:var(--grad);color:#1a0f0f;box-shadow:0 4px 24px rgba(255,107,53,.35)}
.gym b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:1.9rem;letter-spacing:.12em}
.gym span{font-weight:600}
footer{text-align:center;color:var(--mute);font-size:.85rem;margin-top:22px}
footer small{display:block;margin-top:10px;font-size:.66rem;font-weight:800;letter-spacing:.3em;color:#4a5058}
.tira{margin:22px 0 0}
.tira h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:1.5rem;letter-spacing:.06em;margin:0 0 8px;color:var(--mute)}
/* past challenges: one row you swipe sideways, so the page never grows */
.fila{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fila::-webkit-scrollbar{display:none}
.mini{flex:0 0 31%;scroll-snap-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;color:var(--text);font:inherit;text-align:left;position:relative}
.mini img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}
.mini span{display:block;padding:6px 8px 8px;font-size:.74rem;font-weight:700;line-height:1.2;min-height:2.6em}
.mini i{position:absolute;top:6px;right:6px;font-style:normal;font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--grad);color:#1a0f0f}
.mini.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,0,.35)}
.vacio{text-align:center;color:var(--mute);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://hooporia.mobi">COGNITIVO GYM</a>
    <span class="tag">CADA PUNTO CUENTA</span>
    <h1>RETO DE LA SEMANA</h1>
    <p class="sub">Atención y memoria, en la cancha. ¿Lo puedes resolver?</p>
  </header>

  <main id="retos"><div class="vacio">Cargando…</div></main>

  <a class="gym" href="https://hooporia.mobi">
    <b>ENTRENA TU MENTE</b>
    <span>Juega los cuatro juegos de Cognitivo Gym →</span>
  </a>
  <footer>Un reto nuevo cada semana · Cognitivo Gym<small>POWERED BY GOSTAR DIGITAL</small></footer>
</div>
<script>
/* ── THE CHALLENGES ──────────────────────────────────────────────────
   One line per challenge. "publicado" puts it on the page; "respuesta"
   shows its answer video. The newest published one is the challenge of
   the week; the rest show below it. To release a challenge or its
   answer, change false to true here (and nothing else). */
var RETOS = [
  { id: 'sigue-el-balon', titulo: '¿Puedes seguir el balón?',
    como: 'Sigue el balón marcado en rojo mientras cambian de lugar. Al final: ¿en el 1, el 2 o el 3?',
    publicado: true, respuesta: true }
];

(function(){
  var vivos = RETOS.filter(function(r){ return r.publicado }).reverse();     /* newest first */
  var main = document.getElementById('retos');
  if (!vivos.length) { main.innerHTML = '<div class="vacio">Pronto: el primer reto.</div>'; return }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c] }) }
  function vid(n, pre){ return '<div class="vid"><video playsinline preload="' + pre + '" poster="portadas/' + n + '.jpg" src="' + n + '.mp4"></video>' +
    '<button class="play" type="button" aria-label="Play"><span></span></button></div>' }
  function enlace(r){ return location.origin + location.pathname + '#' + r.id }
  /* One challenge on screen at a time; the others wait in a sideways strip. */
  function ficha(r){
    var k = vivos.indexOf(r);
    return '<section class="reto" id="' + r.id + '">' +
      '<span class="kick' + (k ? ' old' : '') + '">' + (k ? 'Reto anterior' : 'Reto de la semana') + '</span>' +
      '<h2>' + esc(r.titulo) + '</h2>' +
      vid(r.id, 'metadata') +
      '<div class="como">' + esc(r.como) + '</div>' +
      '<div class="btns">' +
        '<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent('🏀 ' + r.titulo + ' ¿Lo puedes resolver?\n' + enlace(r)) + '">WhatsApp</a>' +
        '<button class="btn copy" type="button" data-u="' + esc(enlace(r)) + '">Copiar enlace</button>' +
      '</div>' +
      (r.respuesta ? '<details class="resp"><summary>Ver la respuesta</summary>' +
        vid(r.id + '-respuesta', 'none') + '</details>' : '') +
    '</section>';
  }
  function tira(actual){
    if (vivos.length < 2) return '';
    return '<div class="tira"><h3>Todos los retos</h3><div class="fila">' +
      vivos.map(function(r, k){
        return '<button class="mini' + (r === actual ? ' sel' : '') + '" type="button" data-id="' + r.id + '">' +
          '<img loading="lazy" alt="" src="portadas/' + r.id + '.jpg">' + (k === 0 ? '<i>NUEVO</i>' : r.respuesta ? '<i>✓ RESPUESTA</i>' : '') +
          '<span>' + esc(r.titulo) + '</span></button>';
      }).join('') + '</div></div>';
  }
  function buscar(id){ for (var i = 0; i < vivos.length; i++) if (vivos[i].id === id) return vivos[i]; return null }
  function mostrar(r, mover){
    main.querySelectorAll('video').forEach(function(v){ v.pause() });
    main.innerHTML = ficha(r) + tira(r);
    var sel = main.querySelector('.mini.sel'); if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    if (mover) main.querySelector('.reto').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  mostrar(buscar(location.hash.slice(1)) || vivos[0], !!buscar(location.hash.slice(1)));
  window.addEventListener('hashchange', function(){ var r = buscar(location.hash.slice(1)); if (r) mostrar(r, true) });
  main.addEventListener('click', function(e){
    /* tap the button to play from where it stopped; tap the video to pause */
    var m = e.target.closest('.mini');
    if (m) { var r = buscar(m.getAttribute('data-id')); history.replaceState(null, '', r === vivos[0] ? location.pathname : '#' + r.id); mostrar(r, true); return }
    var w = e.target.closest('.vid');
    if (w) { var v = w.querySelector('video'); if (v.paused) { if (v.ended) v.currentTime = 0; v.play() } else v.pause(); return }
    var b = e.target.closest('.copy'); if (!b) return;
    var u = b.getAttribute('data-u'), t = b.textContent;
    function ok(){ b.textContent = '¡Copiado!'; setTimeout(function(){ b.textContent = t }, 1800) }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(u).then(ok, function(){ viejo() }); else viejo();
    function viejo(){ try { var x = document.createElement('textarea'); x.value = u; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); ok() } catch(err){} }
  });
  /* only one video plays at a time */
  main.addEventListener('play', function(e){ e.target.parentNode.classList.add('on'); main.querySelectorAll('video').forEach(function(v){ if (v !== e.target) v.pause() }) }, true);
  main.addEventListener('pause', function(e){ e.target.parentNode.classList.remove('on') }, true);
})();
</script>
</body>
</html>
