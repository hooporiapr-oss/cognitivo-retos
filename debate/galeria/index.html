<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galería · El Debate del Día · Cognitivo Gym</title>
<meta name="description" content="El arte de cada Debate del Día: una obra original por cada pregunta de baloncesto.">
<meta property="og:title" content="🏀 Galería · El Debate del Día">
<meta property="og:description" content="Una obra de arte original por cada debate de baloncesto. Mira cómo votó la comunidad.">
<meta property="og:image" content="https://cognogym.com/debate/og.jpg">
<meta property="og:url" content="https://cognogym.com/debate/galeria/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0a0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Bebas Neue';src:url(../../BebasNeue.woff) format('woff');font-display:swap}
:root{--bg:#0a0a0f;--card:#14141c;--line:#2a2a36;--text:#fff;--mute:#8892a0;--orange:#FF6B35;--gold:#FFD700;--grad:linear-gradient(135deg,var(--gold),var(--orange))}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:radial-gradient(900px 600px at 50% 0%,#2a1d08 0%,var(--bg) 70%) no-repeat,var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{width:min(1080px,100% - 32px);margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 0 48px}
.atras{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.9rem;text-decoration:none;color:var(--text);padding:8px 14px 8px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);margin-bottom:12px}
.atras:hover{border-color:var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.25rem;letter-spacing:4px;text-decoration:none;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-weight:800;font-size:.78rem;padding:6px 12px;border:0;background:transparent;color:var(--mute);cursor:pointer}
.lang button.on{background:var(--grad);color:#1a0f0f}
header{text-align:center;margin:16px 0 18px}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(2.6rem,11vw,3.6rem);letter-spacing:.03em;margin:0;line-height:1}
h1 b{font-weight:400;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--mute);font-weight:600;margin:6px 0 0}
.votar{display:inline-block;margin-top:14px;font-weight:800;text-decoration:none;padding:12px 22px;border-radius:999px;background:var(--grad);color:#1a0f0f}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.obra{position:relative;display:block;width:100%;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer;aspect-ratio:4/5;text-align:left;color:inherit;font:inherit}
.obra img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.obra:hover img{transform:scale(1.04)}
.obra .info{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;background:linear-gradient(transparent,rgba(10,10,15,.94) 55%)}
.obra .f{display:block;font-size:.68rem;font-weight:800;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.obra .q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:800;font-size:.86rem;line-height:1.25;margin-top:2px}
.obra .hoy{position:absolute;top:8px;left:8px;font-size:.62rem;font-weight:800;letter-spacing:.14em;padding:4px 9px;border-radius:999px;background:var(--grad);color:#1a0f0f}
.obra .dom{position:absolute;top:8px;right:8px;font-size:.62rem;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:999px;background:rgba(10,10,15,.8);color:var(--orange)}
.mas{display:block;width:100%;max-width:420px;margin:18px auto 0;font:inherit;font-weight:800;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.vacio{text-align:center;color:var(--mute);padding:40px 6px}
footer{text-align:center;margin-top:26px;font-size:.85rem;color:var(--mute)}
footer a{color:var(--gold);font-weight:700;text-decoration:none}
.full{position:fixed;inset:0;background:#050508;display:none;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
.full.on{display:block}
.full .in{width:min(560px,100% - 28px);margin:0 auto;padding:calc(env(safe-area-inset-top) + 56px) 0 40px}
.full img{display:block;width:100%;border-radius:14px}
.full .x{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.3rem;cursor:pointer;z-index:2}
.full .nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.4rem;cursor:pointer;z-index:2}
.full .ant{left:10px}.full .sig{right:10px}
.full .nav[hidden]{display:none}
@media (max-width:640px){.full .nav{top:calc(env(safe-area-inset-top) + 10px);transform:none;width:42px;height:42px}.full .ant{left:12px}.full .sig{left:62px;right:auto}}
.det .f{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin:14px 0 2px}
.det .q{font-family:'Bebas Neue',Impact,sans-serif;font-size:2rem;letter-spacing:.02em;line-height:1.08;margin:0 0 10px}
.det .row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;font-size:.95rem;margin:7px 0}
.det .row i{grid-column:1/-1;display:block;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.det .row i b{display:block;height:100%;background:var(--grad)}
.det .row.win{font-weight:800;color:var(--gold)}
.det .meta{color:var(--mute);font-size:.85rem;margin-top:6px}
.det .abierto{margin:10px 0 0;color:var(--mute)}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acc a,.acc button{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:800;padding:12px;border-radius:12px;border:0;cursor:pointer}
.acc .wa{grid-column:1/-1;background:#25D366;color:#06210f}
.acc .g{background:var(--grad);color:#1a0f0f}
.acc .o{background:transparent;color:var(--text);border:1.5px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <a class="atras" href="/debate/" id="atras">← El Debate del Día</a>
  <div class="top">
    <a class="brand" href="https://cognogym.com">COGNITIVO GYM</a>
    <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button></div>
  </div>
  <header>
    <h1 id="titulo"></h1>
    <p class="sub" id="sub"></p>
    <a class="votar" href="/debate/" id="votar"></a>
  </header>
  <main id="app"><div class="vacio" id="cargando"></div></main>
  <footer><a href="/debate/" id="pie"></a></footer>
</div>
<div class="full" id="full" role="dialog" aria-modal="true">
  <button class="x" type="button" id="cerrar" aria-label="Volver a la galería">✕</button>
  <button class="nav ant" type="button" id="ant" aria-label="Anterior">‹</button>
  <button class="nav sig" type="button" id="sig" aria-label="Siguiente">›</button>
  <div class="in" id="det"></div>
</div>
<script>
(function(){
  var API = 'https://hooporia-server.onrender.com/debate';
  var BASE = 'https://cognogym.com';
  var T = {
    es: { titulo: 'GALERÍA <b>DEL DEBATE</b>', sub: 'Una obra original por cada pregunta.', votar: 'Vota en el debate de hoy →', pie: 'El Debate del Día · cognogym.com/debate', atras: '← Volver al Debate del Día',
      cargando: 'Cargando la galería…', nada: 'Todavía no hay obras. ¡La primera llega con el próximo debate!', error: 'No se pudo cargar. Revisa tu conexión.', reintentar: 'Intentar otra vez',
      mas: 'Ver más obras', hoy: 'HOY', domingo: 'DOMINGO', abierto: 'Este debate está abierto. ¡Vota y mira los resultados!', irVotar: 'Votar ahora',
      votos: function(n){ return n === 1 ? '1 voto' : n.toLocaleString('es') + ' votos' },
      wa: 'COMPARTIR POR WHATSAPP', bajar: 'Descargar', copiar: 'Copiar enlace', copiado: '¡Copiado!', locale: 'es',
      msg: function(q){ return '🏀 Mira el arte del Debate del Día: ' + q } },
    en: { titulo: 'DEBATE <b>GALLERY</b>', sub: 'An original artwork for every question.', votar: 'Vote in today\'s debate →', pie: 'The Daily Bucket · cognogym.com/debate', atras: '← Back to The Daily Bucket',
      cargando: 'Loading the gallery…', nada: 'No artwork yet. The first one arrives with the next debate!', error: 'Couldn\'t load. Check your connection.', reintentar: 'Try again',
      mas: 'See more artwork', hoy: 'TODAY', domingo: 'SUNDAY', abierto: 'This debate is open. Vote and see the results!', irVotar: 'Vote now',
      votos: function(n){ return n === 1 ? '1 vote' : n.toLocaleString('en') + ' votes' },
      wa: 'SHARE ON WHATSAPP', bajar: 'Download', copiar: 'Copy link', copiado: 'Copied!', locale: 'en',
      msg: function(q){ return '🏀 Check out the art from The Daily Bucket: ' + q } }
  };
  function leer(k){ try { return localStorage.getItem(k) } catch (e) { return null } }
  function guardar(k, v){ try { localStorage.setItem(k, v) } catch (e) {} }
  var lang = leer('cg-lang') === 'en' ? 'en' : 'es';
  var S = { hoy: null, lista: [], fin: false, cargado: false, error: false, abierta: -1 };
  var app = document.getElementById('app');
  function t(){ return T[lang] }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c] }) }
  function txt(o){ return (o && (o[lang] || o.es)) || '' }
  function pct(n, tot){ return tot ? Math.round(n * 100 / tot) : 0 }
  function fecha(f, corta){ try { return new Date(f + 'T12:00:00-04:00').toLocaleDateString(t().locale, corta ? { day: 'numeric', month: 'short', timeZone: 'America/Puerto_Rico' } : { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'America/Puerto_Rico' }) } catch (e) { return f } }
  function src(a){ return /^\/debate\/arte\/[\w.-]+\.(jpe?g|png|webp)$/i.test(a || '') ? a : '' }
  /* only debates with art, today first, then the archive newest first */
  function obras(){ var l = []; if (S.hoy && src(S.hoy.arte)) l.push(Object.assign({ esHoy: true }, S.hoy)); S.lista.forEach(function(a){ if (src(a.arte)) l.push(a) }); return l }

  function pintar(){
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l') === lang) });
    document.getElementById('titulo').innerHTML = t().titulo;
    document.getElementById('sub').textContent = t().sub;
    document.getElementById('votar').textContent = t().votar;
    document.getElementById('pie').textContent = t().pie;
    document.getElementById('atras').textContent = t().atras;
    if (!S.cargado) { app.innerHTML = S.error ? '<div class="vacio">' + t().error + '<br><button class="mas" id="otra">' + t().reintentar + '</button></div>' : '<div class="vacio">' + t().cargando + '</div>'; return }
    var l = obras();
    if (!l.length && S.fin) { app.innerHTML = '<div class="vacio">' + t().nada + '</div>'; return }
    app.innerHTML = '<div class="grid">' + l.map(function(o, i){
      return '<button class="obra" type="button" data-i="' + i + '"><img src="' + esc(src(o.arte)) + '" alt="' + esc(txt(o)) + '" loading="lazy">' +
        (o.esHoy ? '<span class="hoy">' + t().hoy + '</span>' : '') + (o.domingo ? '<span class="dom">' + t().domingo + '</span>' : '') +
        '<span class="info"><span class="f">' + fecha(o.fecha, true) + '</span><span class="q">' + esc(txt(o)) + '</span></span></button>';
    }).join('') + '</div>' + (S.fin ? '' : '<button class="mas" id="mas">' + t().mas + '</button>');
    if (S.abierta >= 0) detalle(S.abierta);
  }

  function detalle(i){
    var l = obras(), o = l[i]; if (!o) return cerrar();
    S.abierta = i;
    var url = BASE + src(o.arte), h = '<img src="' + esc(src(o.arte)) + '" alt="' + esc(txt(o)) + '"><div class="det"><div class="f">' + fecha(o.fecha) + '</div><div class="q">' + esc(txt(o)) + '</div>';
    if (o.esHoy) h += '<p class="abierto">' + t().abierto + '</p>';
    else {
      var max = Math.max.apply(null, o.opciones.map(function(x){ return x.votos }));
      h += o.opciones.map(function(x){ var w = o.total && x.votos === max; return '<div class="row' + (w ? ' win' : '') + '"><span>' + (w ? '🏆 ' : '') + esc(txt(x)) + '</span><span>' + pct(x.votos, o.total) + '%</span><i><b style="width:' + pct(x.votos, o.total) + '%"></b></i></div>' }).join('') +
        '<div class="meta">' + t().votos(o.total) + '</div>';
    }
    h += '<div class="acc"><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(t().msg(txt(o)) + '\n' + BASE + '/debate/galeria/') + '">' + t().wa + '</a>' +
      (o.esHoy ? '<a class="g" href="/debate/">' + t().irVotar + '</a>' : '<a class="g" href="' + esc(src(o.arte)) + '" download="debate-' + o.fecha + '.jpg">' + t().bajar + '</a>') +
      '<button class="o" type="button" id="copiar" data-u="' + esc(url) + '">' + t().copiar + '</button></div></div>';
    document.getElementById('det').innerHTML = h;
    document.getElementById('ant').hidden = i <= 0;
    document.getElementById('sig').hidden = i >= l.length - 1 && S.fin;
    var f = document.getElementById('full'); if (!f.classList.contains('on')) { f.classList.add('on'); document.body.style.overflow = 'hidden' }
    f.scrollTop = 0;
  }
  function cerrar(){ S.abierta = -1; document.getElementById('full').classList.remove('on'); document.body.style.overflow = '' }

  function api(path){ return fetch(API + path).then(function(r){ return r.json() }).then(function(j){ if (!j || !j.ok) throw new Error('x'); return j.data }) }
  function masArchivo(){
    var antes = S.lista.length ? S.lista[S.lista.length - 1].fecha : '';
    return api('/archivo' + (antes ? '?antes=' + antes : '')).then(function(l){ S.lista = S.lista.concat(l); S.fin = l.length < 10 });
  }
  /* keep paging until a screenful of art shows (some days may have none) */
  function llenar(min){ var antes = obras().length; return masArchivo().then(function(){ if (!S.fin && obras().length - antes < min) return llenar(min - (obras().length - antes)) }) }
  function cargar(){
    S.error = false; pintar();
    api('/hoy').then(function(d){ S.hoy = d.hoy; return llenar(8) }).then(function(){ S.cargado = true; pintar() }, function(){ if (!S.cargado) { S.error = true; pintar() } });
  }

  app.addEventListener('click', function(e){
    var o = e.target.closest('.obra'); if (o) { detalle(+o.getAttribute('data-i')); return }
    if (e.target.closest('#mas')) { var b = e.target.closest('#mas'); b.disabled = true; llenar(8).then(pintar, function(){ b.disabled = false }); return }
    if (e.target.closest('#otra')) cargar();
  });
  document.getElementById('cerrar').addEventListener('click', cerrar);
  document.getElementById('ant').addEventListener('click', function(){ detalle(S.abierta - 1) });
  document.getElementById('sig').addEventListener('click', function(){
    var i = S.abierta + 1; if (i < obras().length) return detalle(i);
    if (!S.fin) llenar(4).then(function(){ pintar(); detalle(i) });
  });
  document.getElementById('det').addEventListener('click', function(e){
    var c = e.target.closest('#copiar'); if (!c) return;
    var u = c.getAttribute('data-u'), tx = c.textContent;
    function ok(){ c.textContent = t().copiado; setTimeout(function(){ c.textContent = tx }, 1800) }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(u).then(ok, function(){}); else ok();
  });
  document.addEventListener('keydown', function(e){
    if (S.abierta < 0) return;
    if (e.key === 'Escape') cerrar();
    if (e.key === 'ArrowLeft' && S.abierta > 0) detalle(S.abierta - 1);
    if (e.key === 'ArrowRight') document.getElementById('sig').click();
  });
  document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click', function(){ lang = b.getAttribute('data-l'); guardar('cg-lang', lang); pintar() }) });
  pintar(); cargar();
})();
</script>
</body>
</html>
